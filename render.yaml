databases:
  - name: educms-db
    plan: free
    databaseName: educms_db
    user: educms

services:
  - type: web
    name: educms-api
    runtime: docker
    plan: free
    dockerfilePath: ./educms-backend/Dockerfile
    dockerContext: ./educms-backend
    healthCheckPath: /health
    preDeployCommand: node src/database/migrate.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_VERSION
        value: v1
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRE
        value: 30d
      - key: DATABASE_URL
        fromDatabase:
          name: educms-db
          property: connectionString
      - key: FRONTEND_URL
        value: http://localhost:3000
